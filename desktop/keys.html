<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>API keys</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 22px 22px 18px; background: #040a14; color: #e6f5ff; font: 13px/1.45 "Chakra Petch", system-ui, sans-serif; -webkit-user-select: none; }
  h1 { margin: 0 0 4px; font-size: 14px; letter-spacing: .14em; }
  p.sub { margin: 0 0 16px; color: #a3c0d6; font-size: 12px; }
  .row { border: 1px solid #1c3752; background: #0a1525; padding: 10px 12px; margin-bottom: 10px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .top b { letter-spacing: .08em; } .state { font-size: 11px; letter-spacing: .1em; color: #7d9db4; } .state[data-on="true"] { color: #3be3a2; }
  .line { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: #02060d; color: #e6f5ff; border: 1px solid #2f5a7d; padding: 6px 8px; font: 12px "JetBrains Mono", ui-monospace, monospace; border-radius: 0; -webkit-user-select: text; }
  input:focus { outline: 1px solid #3fe0ff; }
  button { background: #0b3a4d; color: #e6f5ff; border: 1px solid #3fe0ff; padding: 6px 12px; font: 600 11px "Chakra Petch", sans-serif; letter-spacing: .1em; cursor: pointer; border-radius: 0; }
  button.ghost { background: transparent; border-color: #2f5a7d; color: #a3c0d6; }
  button:disabled { opacity: .45; cursor: default; }
  #msg { min-height: 18px; margin-top: 4px; font-size: 12px; color: #a3c0d6; } #msg[data-err="true"] { color: #ff6b7a; }
  small { color: #7d9db4; }
</style>
</head>
<body>
<h1>API KEYS</h1>
<p class="sub">Bật thẻ Firecrawl và Crawl4AI trong footer. Key được mã hóa bằng Keychain của macOS, chỉ máy chủ trong app đọc, không hiện lại ở đây.</p>
<div id="rows"></div>
<div id="msg" role="status"></div>
<small>Key chỉ được gửi tới đúng máy chủ của nhà cung cấp (api.firecrawl.dev, api.crawl4ai.com) để đọc số dư.</small>
<script>
const NAMES = [['FIRECRAWL_API_KEY', 'Firecrawl'], ['CRAWL4AI_API_KEY', 'Crawl4AI Cloud']];
const rows = document.getElementById('rows');
const msg = document.getElementById('msg');
const say = (t, err) => { msg.textContent = t || ''; msg.dataset.err = String(Boolean(err)); };
const els = {};
for (const [name, label] of NAMES) {
  const row = document.createElement('div'); row.className = 'row';
  const top = document.createElement('div'); top.className = 'top';
  const b = document.createElement('b'); b.textContent = label;
  const st = document.createElement('span'); st.className = 'state';
  top.append(b, st);
  const line = document.createElement('div'); line.className = 'line';
  const input = document.createElement('input'); input.type = 'password'; input.autocomplete = 'off'; input.spellcheck = false; input.placeholder = name;
  const save = document.createElement('button'); save.textContent = 'LƯU';
  const clear = document.createElement('button'); clear.textContent = 'XÓA'; clear.className = 'ghost';
  line.append(input, save, clear);
  row.append(top, line); rows.append(row);
  els[name] = { st, input, clear };
  save.addEventListener('click', async () => {
    try { render(await window.keys.save(name, input.value)); input.value = ''; say(`Đã lưu key ${label}.`); }
    catch (e) { say(String(e.message || e).replace(/^Error invoking remote method '[^']*': (Error: )?/, ''), true); }
  });
  clear.addEventListener('click', async () => {
    try { render(await window.keys.clear(name)); input.value = ''; say(`Đã xóa key ${label}.`); }
    catch (e) { say(String(e.message || e), true); }
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save.click(); });
}
function render(s) {
  for (const [name] of NAMES) {
    const on = Boolean(s[name]);
    els[name].st.textContent = on ? 'ĐÃ LƯU' : 'CHƯA CÓ';
    els[name].st.dataset.on = String(on);
    els[name].clear.disabled = !on;
  }
}
window.keys.status().then(render);
</script>
</body>
</html>
