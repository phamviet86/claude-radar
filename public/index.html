<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread Board</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="i brand-ic" viewBox="0 0 24 24" data-ic="radar" aria-hidden="true"></svg>
    <h1>THREAD BOARD</h1>
  </div>
  <div class="sb-counts" id="sb-counts" role="group" aria-label="Filter by status"></div>
  <div class="tools">
    <div class="sync" role="status" aria-label="Connection status">
      <span class="sb-item" id="sb-link"><i class="led live" id="sb-led"></i><b id="sb-state">CONNECTING</b></span>
      <span class="sb-item"><span class="sb-k">SYNC</span><span id="stamp">--:--:--</span><span class="sb-dim">/ 5s</span></span>
    </div>
    <button class="btn" id="theme" aria-label="Switch light or dark theme"><svg class="i" id="themeIc" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="themeTx">Auto</span></button>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>

  <div class="bar"><div class="chips" id="chips" aria-label="Filter by project"></div><div class="seg" id="range" role="group" aria-label="Time range for finished threads"></div></div>

  <main>
    <div class="board" id="board">
      <div class="flow" id="flow"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Thread details" tabindex="-1"></aside>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
